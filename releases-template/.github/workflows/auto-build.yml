name: auto-build

# Single-file customer registry.
#
# customers.txt is the only file you touch. Format (one customer per line):
#
#     email:invoice_id
#     # email:invoice_id          ← prefix with # to revoke
#     - email:invoice_id          ← leading "- " bullet also accepted
#     email:invoice_id  # note    ← inline notes after the value are stripped
#
# Pipeline on every push to customers.txt (or workflow_dispatch):
#   1. Parse customers.txt → active + revoked invoice ids.
#   2. (Re)write invoices/<id>.json for every line, signed with
#      NEXORA_SIGNING_KEY. Active lines get status="active"; commented
#      lines get status="revoked".
#   3. Diff vs the previous commit; for every newly-active invoice,
#      dispatch customer-build.yml on SOURCE_REPO with the latest base
#      version pulled from versions/stable.json.
#
# Required secrets on this repo:
#   NEXORA_SIGNING_KEY    hex bytes of the ed25519 signing key
#   PAID_DISPATCH_TOKEN   PAT with actions:write on SOURCE_REPO

on:
  push:
    branches: [main]
    paths:
      - "customers.txt"
  workflow_dispatch: {}

permissions:
  contents: write

env:
  SOURCE_REPO: 8w6s/nexora-paid

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1

      - name: Materialise signing key
        env:
          NEXORA_SIGNING_KEY: ${{ secrets.NEXORA_SIGNING_KEY }}
        run: |
          if [ -z "$NEXORA_SIGNING_KEY" ]; then
            echo "FATAL: NEXORA_SIGNING_KEY secret missing"; exit 1
          fi
          mkdir -p .keys
          printf '%s' "$NEXORA_SIGNING_KEY" > .keys/license-signer.private

      - name: Install crypto deps
        run: |
          mkdir -p .auto-build
          cat > .auto-build/package.json <<'JSON'
          { "name": "auto-build", "private": true,
            "dependencies": { "@noble/ed25519": "^3.0.0", "@noble/hashes": "^2.0.0" } }
          JSON
          (cd .auto-build && bun install --silent)

      - name: Write driver script
        run: |
          cat > .auto-build/driver.mjs <<'DRIVER_EOF'
          import { readFileSync, writeFileSync, mkdirSync, existsSync, readdirSync, rmSync } from "node:fs";
          import { createDecipheriv } from "node:crypto";
          import { execSync } from "node:child_process";
          import { resolve } from "node:path";
          import * as ed from "@noble/ed25519";
          import { sha512 } from "@noble/hashes/sha2.js";

          const CUSTOMERS_KEY_HEX = (process.env.NEXORA_CUSTOMERS_KEY || "").trim();
          if (!CUSTOMERS_KEY_HEX || CUSTOMERS_KEY_HEX.length !== 64) {
            console.error("[auto-build] NEXORA_CUSTOMERS_KEY missing or wrong length");
            process.exit(1);
          }
          const CUSTOMERS_KEY = Buffer.from(CUSTOMERS_KEY_HEX, "hex");

          // Decrypt a `nx1:<base64>` line into plain `email:invoice_id`.
          // Returns null when the line isn't an nx1 record so the parser
          // can fall back to treating it as a plaintext line / comment.
          function decryptLine(line) {
            if (!line.startsWith("nx1:")) return null;
            const raw = Buffer.from(line.slice(4), "base64");
            if (raw.length < 12 + 16 + 1) return null;
            const iv = raw.subarray(0, 12);
            const tag = raw.subarray(12, 28);
            const ct = raw.subarray(28);
            try {
              const d = createDecipheriv("aes-256-gcm", CUSTOMERS_KEY, iv);
              d.setAuthTag(tag);
              return Buffer.concat([d.update(ct), d.final()]).toString("utf8");
            } catch {
              return null;
            }
          }

          // The workflow runs this script from the .auto-build/ dir (so
          // node_modules resolves), but the data we care about lives at the
          // repo root. REPO_ROOT is set by the job env.
          const ROOT = process.env.REPO_ROOT || resolve(process.cwd(), "..");
          const P = (p) => resolve(ROOT, p);
          process.chdir(ROOT);

          if (!ed.hashes.sha512) ed.hashes.sha512 = (m) => sha512(m);

          const canonicalize = (v) => {
            if (v === null || typeof v !== "object") return JSON.stringify(v);
            if (Array.isArray(v)) return `[${v.map(canonicalize).join(",")}]`;
            const ks = Object.keys(v).sort();
            return `{${ks.map((k) => `${JSON.stringify(k)}:${canonicalize(v[k])}`).join(",")}}`;
          };
          const hexToBytes = (h) => {
            const c = h.startsWith("0x") ? h.slice(2) : h;
            const o = new Uint8Array(c.length / 2);
            for (let i = 0; i < o.length; i++) o[i] = parseInt(c.slice(i * 2, i * 2 + 2), 16);
            return o;
          };
          const bytesToHex = (b) => Array.from(b).map((x) => x.toString(16).padStart(2, "0")).join("");

          const ID = /^[A-Za-z0-9._-]{4,64}$/;
          const EMAIL = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

          function parse(text) {
            // Permissive parser: lines we can't make sense of are SKIPPED
            // (treated as documentation comments), never raise errors. Only
            // hard- gradually.
            const out = new Map();
            const errors = [];
            text.split(/\r?\n/).forEach((raw, i) => {
              const lineNo = i + 1;
              let line = raw.trim();
              if (!line) return;
              const commented = line.startsWith("#");
              if (commented) line = line.replace(/^#+\s*/, "");
              if (line.startsWith("-")) line = line.slice(1).trim();
              if (!line) return;
              if (line.startsWith("nx1:")) {
                const dec = decryptLine(line);
                if (!dec) {
                  errors.push(`line ${lineNo}: encrypted entry failed to decrypt`);
                  return;
                }
                line = dec;
              }
              const h = line.indexOf("#");
              if (h !== -1) line = line.slice(0, h).trim();
              if (!line) return;
              const colon = line.lastIndexOf(":");
              if (colon === -1) return;
              const email = line.slice(0, colon).trim().toLowerCase();
              const invoiceId = line.slice(colon + 1).trim();
              if (!EMAIL.test(email) || !ID.test(invoiceId)) return;
              const existing = out.get(invoiceId);
              if (existing && existing.email !== email) {
                errors.push(`line ${lineNo}: invoice ${invoiceId} reused with different email (${existing.email} vs ${email})`);
                return;
              }
              out.set(invoiceId, { email, active: !commented });
            });
            return { entries: out, errors };
          }

          function prevRegistry() {
            try {
              const txt = execSync("git show HEAD^:customers.txt", { stdio: ["ignore", "pipe", "ignore"] }).toString();
              return parse(txt).entries;
            } catch { return new Map(); }
          }

          async function sign(payload, priv) {
            const msg = new TextEncoder().encode(canonicalize(payload));
            return bytesToHex(await ed.sign(msg, priv));
          }

          async function main() {
            if (!existsSync("customers.txt")) {
              console.log("[auto-build] customers.txt missing — nothing to do");
              writeFileSync(process.env.GITHUB_OUTPUT, "dispatches=[]\n", { flag: "a" });
              return 0;
            }
            const text = readFileSync("customers.txt", "utf8");
            const { entries: current, errors } = parse(text);
            if (errors.length) {
              for (const e of errors) console.error("[auto-build] " + e);
              return 1;
            }
            const previous = prevRegistry();
            const priv = hexToBytes(readFileSync(".keys/license-signer.private", "utf8").trim());
            mkdirSync("invoices", { recursive: true });
            const written = new Set();
            const dispatches = [];

            for (const [id, { email, active }] of current.entries()) {
              const prev = previous.get(id);
              const prevStatus = prev ? (prev.active ? "active" : "revoked") : null;
              const fp = `invoices/${id}.json`;
              // A commented line that was never previously active is just
              // documentation — skip without creating a revoked file.
              if (!active && !prev && !existsSync(fp)) continue;
              written.add(id);
              const desired = active ? "active" : "revoked";
              // NB: email is intentionally NOT in the on-disk payload — the
              // file is published to a public repo; leaking the email here
              // would defeat the customers.txt encryption above.
              if (prev && prevStatus === desired && existsSync(fp)) continue;
              const payload = {
                invoiceId: id,
                status: desired,
                issuedAt: new Date().toISOString(),
                productId: "nexora-paid",
              };
              const signature = await sign(payload, priv);
              writeFileSync(fp, JSON.stringify({ payload, signature }, null, 2) + "\n");
              console.log(`[auto-build] wrote ${fp} (${desired})`);
              if (active && prevStatus !== "active") dispatches.push({ invoiceId: id, email });
            }

                          for (const [id] of previous.entries()) {
              if (written.has(id)) continue;
              const fp = `invoices/${id}.json`;
              const payload = {
                invoiceId: id,
                status: "revoked",
                issuedAt: new Date().toISOString(),
                productId: "nexora-paid",
              };
              const signature = await sign(payload, priv);
              writeFileSync(fp, JSON.stringify({ payload, signature }, null, 2) + "\n");
              console.log(`[auto-build] revoked (deleted line): ${fp}`);
            }

            for (const name of readdirSync("invoices")) {
              if (!name.endsWith(".json")) continue;
              const id = name.replace(/\.json$/, "");
              if (current.has(id) || previous.has(id)) continue;
              rmSync(`invoices/${name}`);
              console.log(`[auto-build] removed stray invoices/${name}`);
            }

            writeFileSync(
              process.env.GITHUB_OUTPUT,
              `dispatches=${JSON.stringify(dispatches)}\n`,
              { flag: "a" },
            );
            console.log(`[auto-build] new images: ${dispatches.length}`);
            return 0;
          }

          process.exit(await main());
          DRIVER_EOF

      - name: Parse + regenerate invoices
        id: pipeline
        env:
          REPO_ROOT: ${{ github.workspace }}
          NEXORA_CUSTOMERS_KEY: ${{ secrets.NEXORA_CUSTOMERS_KEY }}
        run: |
          cd .auto-build
          bun run driver.mjs

      - name: Read base version
        id: ver
        if: steps.pipeline.outputs.dispatches != '[]' && steps.pipeline.outputs.dispatches != ''
        run: |
          if [ ! -f versions/stable.json ]; then
            echo "FATAL: versions/stable.json missing"; exit 1
          fi
          LATEST=$(python3 -c "import json; print(json.load(open('versions/stable.json'))['latest'])")
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"

      - name: Commit regenerated invoices/
        run: |
          rm -rf .keys .auto-build
          git config user.email "invoice-bot@nexora"
          git config user.name "nexora invoice bot"
          git add invoices/
          if git diff --cached --quiet; then
            echo "no invoice file changes"
          else
            git commit -m "auto: regenerate invoices from customers.txt"
            git push
          fi

      - name: Dispatch customer-build per new active invoice
        if: steps.pipeline.outputs.dispatches != '[]' && steps.pipeline.outputs.dispatches != ''
        env:
          GH_TOKEN: ${{ secrets.PAID_DISPATCH_TOKEN }}
          DISPATCHES: ${{ steps.pipeline.outputs.dispatches }}
          LATEST: ${{ steps.ver.outputs.latest }}
          SOURCE_REPO: ${{ env.SOURCE_REPO }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "FATAL: PAID_DISPATCH_TOKEN missing"; exit 1
          fi
          python3 - <<'PY'
          import json, os, subprocess, sys
          dispatches = json.loads(os.environ["DISPATCHES"])
          latest = os.environ["LATEST"]
          source = os.environ["SOURCE_REPO"]
          rc = 0
          for d in dispatches:
              cmd = ["gh", "workflow", "run", "customer-build.yml",
                     "-R", source,
                     "-f", f"invoice_id={d['invoiceId']}",
                     "-f", f"email={d['email']}",
                     "-f", f"version={latest}",
                     "-f", "tag_latest=true"]
              print("→", " ".join(cmd))
              if subprocess.run(cmd).returncode != 0: rc = 1
          sys.exit(rc)
          PY