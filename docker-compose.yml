# Nexora — production-grade self-hosted stack.
#
# Three deployment modes (pick one — no rebuild needed to switch):
#
#   1) LOCAL / DEV (default)
#        docker compose up
#      Open http://localhost — Caddy serves on :80 (no HTTPS).
#
#   2) PUBLIC DOMAIN with auto-HTTPS  (recommended for production)
#        DOMAIN=shop.example.com ADMIN_EMAIL=you@example.com docker compose up -d
#      Caddy gets a Let's Encrypt cert automatically. Point DNS A/AAAA to this host.
#
#   3) CLOUDFLARE TUNNEL  (no open ports, works behind NAT/CGNAT)
#        CLOUDFLARE_TUNNEL_TOKEN=... docker compose --profile tunnel up -d
#      No need to open 80/443. CF terminates TLS, tunnels to caddy:80 internally.
#
# SQLite persists in the `nexora-db` named volume.
# Caddy cert/key data persists in `caddy-data` (do NOT delete — re-issuing certs
# repeatedly hits Let's Encrypt rate limits).

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      # Skipped when running with --profile tunnel; harmless to leave exposed.
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      DOMAIN: "${DOMAIN:-localhost}"
      ADMIN_EMAIL: "${ADMIN_EMAIL:-admin@localhost}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - backend
      - frontend

  backend:
    build: ./backend
    expose:
      - "3000"
    environment:
      PORT: "3000"
      NODE_ENV: production
      # When behind Caddy on a real domain, PUBLIC_ORIGIN should match.
      PUBLIC_ORIGIN: "${PUBLIC_ORIGIN:-http://localhost}"
      ADMIN_EMAIL: "${ADMIN_EMAIL:-admin@nexora.local}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-change-me}"
      # Caddy sets X-Forwarded-* — backend must trust it to read real client IP
      # (otherwise per-IP rate limits all see the same docker network address).
      TRUST_PROXY: "true"
      # Optional: ADMIN_PASSWORD_HASH, LTC_XPUB, EMAIL_PROVIDER, RESEND_API_KEY, SMTP_*
    volumes:
      - nexora-db:/app
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Same-origin: API calls go to /api/* on the same host as the page.
        # Caddy routes /api/* to backend, everything else to frontend.
        PUBLIC_API_ORIGIN: "${PUBLIC_API_ORIGIN:-}"
        PUBLIC_SITE_URL: "${PUBLIC_SITE_URL:-http://localhost}"
    expose:
      - "4321"
    depends_on:
      - backend
    restart: unless-stopped

  # Optional: Cloudflare Tunnel — enable with `--profile tunnel`.
  # User pastes their tunnel token (from CF Zero Trust dashboard); cloudflared
  # forwards traffic to caddy:80 inside the docker network. No ports exposed.
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - caddy

volumes:
  nexora-db:
  caddy-data:
  caddy-config: