name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve tag
        id: ver
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VER="${TAG#v}"
          echo "tag=$TAG"     >> "$GITHUB_OUTPUT"
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push backend
        id: backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/nexora-backend:${{ steps.ver.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/nexora-backend:latest
          provenance: true
          sbom: true

      - name: Build & push frontend
        id: frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/nexora-frontend:${{ steps.ver.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/nexora-frontend:latest
          provenance: true
          sbom: true

      - name: Build & push updater
        uses: docker/build-push-action@v6
        with:
          context: ./updater
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/nexora-updater:${{ steps.ver.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/nexora-updater:latest

      - name: Build & push fileserver
        uses: docker/build-push-action@v6
        with:
          context: ./fileserver
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/nexora-fileserver:${{ steps.ver.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/nexora-fileserver:latest

      - name: Update releases repo (versions/stable.json + changelog)
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
          RELEASES_REPO: ${{ vars.NEXORA_RELEASES_REPO }}
          BACKEND_DIGEST: ${{ steps.backend.outputs.digest }}
        run: |
          [ -z "$RELEASES_REPO" ] && { echo "NEXORA_RELEASES_REPO var not set, skipping"; exit 0; }
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${RELEASES_REPO}.git" rel
          cd rel
          mkdir -p versions changelog
          cat > versions/stable.json <<JSON
          {
            "latest": "${{ steps.ver.outputs.version }}",
            "min": "1.0.0",
            "channel": "stable",
            "imageRepo": "ghcr.io/${{ github.repository_owner }}/nexora-backend",
            "imageTag": "${{ steps.ver.outputs.version }}",
            "sha256": "${BACKEND_DIGEST}",
            "publishedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "changelogUrl": "https://github.com/${{ github.repository }}/releases/tag/${{ steps.ver.outputs.tag }}"
          }
          JSON
          # Pull release body for the markdown changelog file.
          gh api "repos/${{ github.repository }}/releases/tags/${{ steps.ver.outputs.tag }}" \
            --jq .body > "changelog/${{ steps.ver.outputs.version }}.md" || true
          git config user.email "release-bot@nexora"
          git config user.name "nexora release bot"
          git add .
          git commit -m "release: ${{ steps.ver.outputs.version }}" || echo "no changes"
          git push

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true