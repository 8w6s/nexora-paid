name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve tag
        id: ver
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VER="${TAG#v}"
          echo "tag=$TAG"     >> "$GITHUB_OUTPUT"
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Combined image — backend + frontend in one. No invoice baked at this
      # stage; per-customer images are forked from here by customer-build.yml.
      - name: Build & push combined image (base)
        id: combined
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          build-args: |
            NEXORA_RELEASES_PAT=${{ secrets.NEXORA_RELEASES_PAT }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/nexora:${{ steps.ver.outputs.version }}-base
            ghcr.io/${{ github.repository_owner }}/nexora:${{ steps.ver.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/nexora:latest
          provenance: true
          sbom: true

      - name: Build & push updater
        uses: docker/build-push-action@v6
        with:
          context: ./updater
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/nexora-updater:${{ steps.ver.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/nexora-updater:latest

      - name: Build & push fileserver
        uses: docker/build-push-action@v6
        with:
          context: ./fileserver
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/nexora-fileserver:${{ steps.ver.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/nexora-fileserver:latest

      - name: Install repo deps (for sign-manifest)
        run: bun install --frozen-lockfile

      # Drop the signing key into .keys/ from the secret. Without this the
      # sign-manifest script bails. NEVER print or upload the key. The job
      # runner is ephemeral; the file is wiped when the runner is torn down.
      - name: Restore signing key
        env:
          NEXORA_SIGNING_KEY: ${{ secrets.NEXORA_SIGNING_KEY }}
        run: |
          [ -z "$NEXORA_SIGNING_KEY" ] && { echo "FATAL: NEXORA_SIGNING_KEY secret not set"; exit 1; }
          mkdir -p .keys
          printf '%s' "$NEXORA_SIGNING_KEY" > .keys/license-signer.private
          chmod 600 .keys/license-signer.private

      - name: Write + sign stable manifest, publish to releases repo
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
          RELEASES_REPO: ${{ vars.NEXORA_RELEASES_REPO }}
          BACKEND_DIGEST: ${{ steps.combined.outputs.digest }}
          MIN_VERSION: ${{ vars.NEXORA_MIN_VERSION || '1.0.0' }}
        run: |
          [ -z "$RELEASES_REPO" ] && { echo "FATAL: NEXORA_RELEASES_REPO var not set"; exit 1; }
          # Write the canonical plaintext manifest. imageTag uses the
          # ${INVOICE_ID} placeholder so customer backends substitute their
          # baked invoice id at /api/admin/update/check time. Base build
          # backends (no invoice) resolve the placeholder to "-base".
          mkdir -p out/versions out/changelog
          cat > out/versions/stable.json <<JSON
          {
            "channel": "stable",
            "latest": "${{ steps.ver.outputs.version }}",
            "min": "${MIN_VERSION}",
            "imageRepo": "ghcr.io/${{ github.repository_owner }}/nexora",
            "imageTag": "${{ steps.ver.outputs.version }}-\${INVOICE_ID}",
            "sha256": "${BACKEND_DIGEST}",
            "publishedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "changelogUrl": "https://github.com/${{ github.repository }}/releases/tag/${{ steps.ver.outputs.tag }}"
          }
          JSON
          # Sign → produces stable.signed.json that the backend's
          # NEXORA_REQUIRE_SIGNED=1 default actually accepts.
          bun run scripts/sign-manifest.ts \
            --in=out/versions/stable.json \
            --out=out/versions/stable.signed.json \
            --force
          # Pull release body for the markdown changelog file (best-effort).
          gh api "repos/${{ github.repository }}/releases/tags/${{ steps.ver.outputs.tag }}" \
            --jq .body > "out/changelog/${{ steps.ver.outputs.version }}.md" || true
          # Commit to the private releases repo.
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${RELEASES_REPO}.git" rel
          cd rel
          mkdir -p versions changelog
          cp ../out/versions/stable.json versions/stable.json
          cp ../out/versions/stable.signed.json versions/stable.signed.json
          cp "../out/changelog/${{ steps.ver.outputs.version }}.md" "changelog/${{ steps.ver.outputs.version }}.md" 2>/dev/null || true
          git config user.email "release-bot@nexora"
          git config user.name "nexora release bot"
          git add .
          git commit -m "release: ${{ steps.ver.outputs.version }}" || echo "no changes"
          git push

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true