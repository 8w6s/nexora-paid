name: customer-build

# Build a per-invoice image (backend + frontend in one) with the
# customer's invoice id baked into the runtime stage. Dispatched by the
# auto-build workflow on nexora-releases, or manually.

on:
  workflow_dispatch:
    inputs:
      invoice_id:
        description: "Stable invoice id (matches invoices/<id>.json). e.g. inv_2026_001"
        required: true
      email:
        description: "Customer email (watermark only — appears in boot banner)"
        required: true
      version:
        description: "Base version to fork the image from, e.g. 1.0.0 (must already be published by release.yml)"
        required: true
      tag_latest:
        description: "Also push :<invoice_id> rolling tag (default true)"
        required: false
        default: "true"

permissions:
  contents: read
  packages: write

jobs:
  build-customer-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sanitise invoice id
        id: ids
        env:
          RAW_INVOICE: ${{ github.event.inputs.invoice_id }}
        run: |
          if ! printf '%s' "$RAW_INVOICE" | grep -Eq '^[A-Za-z0-9._-]{4,64}$'; then
            echo "FATAL: invoice_id must match [A-Za-z0-9._-]{4,64} (got: $RAW_INVOICE)"
            exit 1
          fi
          echo "invoice_id=$RAW_INVOICE" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push combined per-invoice image
        uses: docker/build-push-action@v6
        with:
          # Build context = repo root so the Dockerfile can COPY both
          # backend/ and frontend/ in one go.
          context: .
          file: ./backend/Dockerfile
          push: true
          build-args: |
            NEXORA_INVOICE_ID=${{ steps.ids.outputs.invoice_id }}
            NEXORA_INVOICE_EMAIL=${{ github.event.inputs.email }}
            NEXORA_RELEASES_REPO=${{ vars.NEXORA_RELEASES_REPO || '8w6s/nexora-releases' }}
            NEXORA_RELEASES_PAT=${{ secrets.NEXORA_RELEASES_PAT }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/nexora:${{ github.event.inputs.version }}-${{ steps.ids.outputs.invoice_id }}
            ${{ github.event.inputs.tag_latest == 'true' && format('ghcr.io/{0}/nexora:latest-{1}', github.repository_owner, steps.ids.outputs.invoice_id) || '' }}
          provenance: true
          sbom: true

      - name: Summary
        env:
          OWNER: ${{ github.repository_owner }}
          VER: ${{ github.event.inputs.version }}
          INV: ${{ steps.ids.outputs.invoice_id }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ### Per-invoice image published (backend + frontend in one)

          \`\`\`
          ghcr.io/${OWNER}/nexora:${VER}-${INV}
          ghcr.io/${OWNER}/nexora:${INV}
          \`\`\`

          Customer runs:

          \`\`\`bash
          docker run -d --name nexora \\
            -e NEXORA_GHCR_TOKEN=<their PAT> \\
            -e ORDER_TOKEN_SECRET=<openssl rand -hex 32> \\
            -e DATABASE_ENCRYPTION_KEY=<openssl rand -hex 32> \\
            -e NEXORA_LICENSE_SECRET=<openssl rand -hex 32> \\
            -e ADMIN_PASSWORD=<a real password> \\
            -p 3000:3000 -p 4321:4321 \\
            -v nexora-db:/app/data \\
            ghcr.io/${OWNER}/nexora:${VER}-${INV}
          \`\`\`
          EOF